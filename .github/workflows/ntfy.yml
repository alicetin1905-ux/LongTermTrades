name: ntfy PnL-melding

on:
  schedule:
    - cron: '*/5 * * * *'   # elke 5 minuten (GitHub kan dit een paar minuten vertragen)
  workflow_dispatch:
    inputs:
      test:
        description: 'Stuur meteen een testmelding'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ntfy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Vorige stand ophalen
        uses: actions/cache/restore@v4
        with:
          path: .ntfy-state
          key: ntfy-state-${{ github.run_id }}
          restore-keys: ntfy-state-

      - name: PnL checken en melden
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_THRESHOLD: ${{ vars.NTFY_THRESHOLD || '10' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: node scripts/notify.mjs

      - name: Stand bewaren
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ntfy-state
          key: ntfy-state-${{ github.run_id }}
